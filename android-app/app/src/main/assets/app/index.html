<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sintonia</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Menu">
    <button class="f nav" data-view="home" aria-label="Início" title="Início"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button class="f nav" data-view="games" aria-label="Jogos do dia" title="Jogos do dia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9 21c0-2 1-3 3-3s3 1 3 3"/></svg><span>Jogos</span></button>
    <button class="f nav" data-view="live" aria-label="Ao vivo" title="Ao vivo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg><span>Ao Vivo</span></button>
    <button class="f nav" data-view="movies" aria-label="Filmes" title="Filmes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg><span>Filmes</span></button>
    <button class="f nav" data-view="series" aria-label="Séries" title="Séries"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 3h12"/></svg><span>Séries</span></button>
    <button class="f nav" data-view="favorites" aria-label="Favoritos" title="Favoritos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg><span>Favoritos</span></button>
    <button class="f nav" data-view="search" aria-label="Buscar" title="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Buscar</span></button>
    <div class="grow"></div>
    <button class="f nav" id="refreshBtn" aria-label="Atualizar: limpa o cache e recarrega a lista" title="Atualizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4L3 10M3 4v6h6M4 13a8 8 0 0 0 14.3 4l2.7-3M21 20v-6h-6"/></svg><span>Atualizar</span></button>
    <button class="f nav" data-view="settings" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"/></svg><span>Ajustes</span></button>
  </nav>
  <main id="main">
    <header id="topbar"><h1 id="viewTitle"></h1><div id="status"></div></header>
    <section id="content"></section>
  </main>
</div>

<div id="detail" class="hidden"></div>
<div id="remote" class="hidden"></div>
<div id="pick" class="hidden"></div>

<div id="player" class="hidden">
  <video id="video" playsinline></video>
  <div id="subOverlay"></div>
  <div id="notice" class="hidden" role="status"><span class="tag">NOVA TEMPORADA</span><span id="noticeText"></span></div>
  <button id="skipIntro" class="f hidden">Pular Abertura</button>
  <div id="nextCard" class="hidden"><img id="nextThumb" alt=""><div><p id="nextCount"></p><p id="nextTitle"></p><p class="nexthint">OK: Assistir Agora · Voltar: Cancelar</p></div></div>
  <div id="osd">
    <div class="osd-bottom">
      <div class="osd-head"><div><div id="osdTitle"></div><div id="osdNow"></div></div><div class="osd-time"><span id="tCur"></span> <span id="tDur"></span></div></div>
      <div class="bar" id="seekBar" tabindex="-1" role="slider" aria-label="Posição do vídeo"><div id="barFill"></div><div id="seekMark"><span id="seekTip"></span></div></div>
      <div class="osd-buttons">
        <button class="f pbtn" data-act="back10" data-for="vod" aria-label="Voltar" title="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6l-8 6 8 6zM21 6l-8 6 8 6z"/></svg></button>
        <button class="f pbtn" data-act="play" aria-label="Pausar" title="Pausar"></button>
        <button class="f pbtn" data-act="fwd10" data-for="vod" aria-label="Avançar" title="Avançar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l8 6-8 6zM13 6l8 6-8 6z"/></svg></button>
        <button class="f pbtn gear" data-act="gear" aria-label="Opções" title="Opções"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"/></svg></button>
      </div>
    </div>
  </div>
  <div id="menu" class="hidden"></div>
  <div id="spinner" class="hidden"><div class="spin"></div></div>
</div>

<div id="remind" class="hidden" role="alert"></div>
<div id="busy" class="hidden"><div class="spin"></div><p id="busyMsg"></p></div>
<div id="toast" class="hidden"></div>
<script src="js/hls.min.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/logos.js"></script>
<script src="js/local-config.js" onerror="void 0"></script>
<script src="js/app.js"></script>
</body>
</html>
